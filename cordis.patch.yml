# Scout bundle patch
#
# Inserts this package as a profile layer. index.js registers:
#   - web search provider  `scout`  (free-first ladder; keyless by default)
#   - web fetch provider   `scout`  (Reddit/SO/HN/Discourse-aware reader)
#   - tools `scout_search` + `scout_read`
#
# No credentials needed. Tune behaviour via the row config below.
# Recommended keyed primary (optional): export BRAVE_API_KEY — slots in first.
# Legacy Google CSE (optional, pre-existing keys only — closed to new
# customers, discontinued 2027-01-01): set googleCx + export GOOGLE_API_KEY.
# Keys are read at request time, so exporting them needs no restart.
# Keys are read at request time, so exporting them needs no restart.
# Privacy: jinaFallback sends blocked-page URLs to the public reader proxy
# (r.jina.ai). Set false for sensitive deployments.

- insert:
    - id: scout
      name: 'scout-dsh'
      config:
        maxResults: 8
        snippetChars: 220
        rerank: true
        recency: 'auto'
        redditBias: 'auto'
        includeDomains: ''
        excludeDomains: ''
        withLinksSummary: false
        includeLinks: false
        fetchTimeoutMs: 15000
        searchTimeoutMs: 12000
        maxChars: 8000
        jinaFallback: true
        googleApiKeyEnv: 'GOOGLE_API_KEY'
        googleCx: ''
        braveApiKeyEnv: 'BRAVE_API_KEY'
